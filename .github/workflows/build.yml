name: Build Geode Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            os: ubuntu-24.04
            target: Android64
          - name: Android32
            os: ubuntu-24.04
            target: Android32

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Ninja is only installed if the runner does not already have it.
      # This step can never hang or fail the build: short timeout, errors ignored.
      - name: Install Ninja
        timeout-minutes: 3
        continue-on-error: true
        run: |
          if command -v ninja >/dev/null 2>&1; then
            ninja --version
            exit 0
          fi
          for i in 1 2 3; do
            sudo apt-get install -y ninja-build && break
            sudo apt-get update || true
            sleep 5
          done
          ninja --version || true

      # Attempt 1. combine: true uploads this platform's build so the
      # package job below can merge them into one .geode.
      - name: Build Mod
        id: build1
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
          combine: true
          use-cpm-cache: false
          sdk: v6.0.0-alpha.1
          cli: latest

      # Attempt 2: only if attempt 1 failed (transient network errors)
      - name: Build Mod (retry)
        if: steps.build1.outcome == 'failure'
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
          combine: true
          use-cpm-cache: false
          sdk: v6.0.0-alpha.1
          cli: latest

  package:
    name: Package builds
    runs-on: ubuntu-24.04
    needs: [ build ]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - uses: actions/upload-artifact@v4
        with:
          name: ChxrCky-Combined
          path: ${{ steps.combine.outputs.build-output }}
